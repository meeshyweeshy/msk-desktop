name: Build & release

# Bump "version" in package.json and push to main: this builds the Windows
# installer + portable zip + extension zip and publishes a GitHub Release
# tagged v<version>. Pushes that don't change the version are skipped.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      exists: ${{ steps.v.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"; echo "v$V already released, skipping"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"; echo "Releasing v$V"
          fi

  windows:
    needs: check
    if: needs.check.outputs.exists == 'false'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --win nsis zip --x64 --publish never
      - name: Extension zip
        shell: bash
        run: |
          node scripts/build-extension.mjs
          mv dist/MSK-extension.zip "dist/MSK-extension-${{ needs.check.outputs.version }}.zip"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: MSK v${{ needs.check.outputs.version }}
          generate_release_notes: true
          files: |
            dist/MSK-Setup-*.exe
            dist/MSK-*-win-x64.zip
            dist/MSK-extension-*.zip
