name: Build & release

# Bump "version" in package.json and push to main: this builds the Windows
# installer + zip, the macOS dmg + zip (Apple Silicon and Intel) and the
# extension zip, then publishes one GitHub Release tagged v<version>.
# Pushes that don't change the version are skipped.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      exists: ${{ steps.v.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"; echo "v$V already released, skipping"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"; echo "Releasing v$V"
          fi

  windows:
    needs: check
    if: needs.check.outputs.exists == 'false'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --win nsis zip --x64 --publish never
      - name: Extension zip
        shell: pwsh
        run: |
          $env:MSK_NO_ZIP = "1"
          node scripts/build-extension.mjs
          Copy-Item dist/extension dist/MSK-extension -Recurse
          Compress-Archive -Path dist/MSK-extension -DestinationPath "dist/MSK-extension-${{ needs.check.outputs.version }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: error
          path: |
            dist/MSK-Setup-*.exe
            dist/MSK-*-win-x64.zip
            dist/MSK-extension-*.zip

  mac:
    needs: check
    if: needs.check.outputs.exists == 'false'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Check the apps start
        run: |
          for a in dist/mac-arm64/MSK.app dist/mac/MSK.app; do
            [ -d "$a" ] || continue
            codesign --verify --deep --verbose=1 "$a"
            file "$a/Contents/MacOS/MSK"
          done
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          if-no-files-found: error
          path: |
            dist/MSK-*-mac-*.dmg
            dist/MSK-*-mac-*.zip

  publish:
    needs: [check, windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - run: ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: MSK v${{ needs.check.outputs.version }}
          generate_release_notes: true
          files: out/*
